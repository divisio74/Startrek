[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "__pycache__",
    "logs",
    "models",
    "product",
    "doc",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N803",  # argument name should be lowercase (ML conventions: X, Y)
    "N806",  # variable in function should be lowercase (ML: X, Y, Q)
    "N812",  # lowercase imported as uppercase (PyTorch: torch.nn.functional as F)
]

[tool.ruff.lint.per-file-ignores]
"project/plot*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
